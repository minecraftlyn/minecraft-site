<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Minecraft LYN - Premium Bedrock Resources</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0B1426;
            --card-bg: #1A273B;
            --card-hover: #22334D;
            --cyan: #00D9FF;
            --text-main: #F1F5F9;
            --text-sub: #94A3B8;
            --border: #2B3A52;
            --glow: 0 0 15px rgba(0, 217, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }
        
        header { 
            background-color: rgba(11, 20, 38, 0.95); 
            backdrop-filter: blur(10px);
            padding: 14px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid var(--border); 
        }
        .menu-btn, .search-icon-btn { background: none; border: none; color: var(--cyan); font-size: 22px; cursor: pointer; }
        .logo-img { height: 36px; object-fit: contain; cursor: pointer; }

        .main-container { max-width: 1000px; margin: 0 auto; padding: 20px 15px 60px 15px; }

        .hero { 
            background: linear-gradient(180deg, rgba(11, 20, 38, 0.5) 0%, var(--bg-dark) 100%), 
                        url('https://github.com/minecraftlyn/Mcphoto/blob/1f9da41800bc4e29cdea3b6a12b25b1ee239b5c9/pixel-minecraft-style-land-background-concept-game-ground-pixelated-horizontal-blue-sky-sun-cloud-vector-illustration-212305683.jpg?raw=true') no-repeat center center; 
            background-size: cover; padding: 30px 20px; border-radius: 16px; border: 1px solid var(--border); text-align: center; margin-bottom: 25px; 
        }
        .hero h1 { font-size: 24px; font-weight: 900; color: var(--text-main); text-shadow: 0 2px 10px rgba(0,0,0,0.8); margin-bottom: 8px; }
        .hero h1 span { color: var(--cyan); text-shadow: var(--glow); }
        .hero p { font-size: 13px; color: var(--text-sub); }

        .search-box input { 
            width: 100%; padding: 14px 22px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 30px; outline: none; color: #fff; font-size: 14px; margin-bottom: 15px; 
        }
        .search-box input:focus { border-color: var(--cyan); box-shadow: var(--glow); }

        .category-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; scrollbar-width: none; }
        .category-chips::-webkit-scrollbar { display: none; }
        .chip { 
            background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer; transition: 0.2s; 
        }
        .chip.active, .chip:hover { background: rgba(0, 217, 255, 0.1); border-color: var(--cyan); color: var(--cyan); box-shadow: var(--glow); }

        .page-section { display: none; }
        .page-section.active { display: block; }
        
        .section-title { 
            font-size: 18px; 
            font-weight: bold; 
            color: var(--text-main); 
            margin: 25px 0 15px 0; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            background: transparent !important;
            border: none !important;
        }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid var(--border); transition: 0.25s ease; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-4px); border-color: var(--cyan); box-shadow: var(--glow); }
        .card img { width: 100%; height: 160px; object-fit: cover; }
        .card-content { padding: 16px; }
        .card-title { font-size: 16px; font-weight: bold; color: var(--text-main); margin-bottom: 8px; }
        .card-desc { font-size: 13px; color: var(--text-sub); margin-bottom: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { font-size: 12px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; }

        .badge { background: rgba(0, 217, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 15px; grid-column: 1 / -1; }

        footer { text-align: center; padding: 30px 20px; font-size: 12px; color: var(--text-sub); border-top: 1px solid var(--border); margin-top: 50px; }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <img src="https://raw.githubusercontent.com/minecraftlyn/Mcphoto/fadf178b72cb6a942deb3105ba06118e7a2d030f/bitmap2216761670976185018.png" alt="Minecraft LYN" class="logo-img">
        <button class="search-icon-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </header>

    <div class="main-container">
        <!-- HOME PAGE -->
        <div id="home-page" class="page-section active">
            <div class="hero">
                <h1>WELCOME TO <span>MINECRAFT LYN</span></h1>
                <p>Download Best Minecraft Bedrock Addons, Shaders & Maps</p>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search addons, shaders, maps...">
            </div>

            <div class="category-chips">
                <div class="chip active">🔥 All</div>
                <div class="chip">🧩 Addons</div>
                <div class="chip">✨ Shaders</div>
                <div class="chip">🗺️ Maps</div>
            </div>

            <div class="section-title">🆕 Latest Updates</div>
            <div class="card-grid" id="home-grid">
                <div class="empty-state">Loading posts...</div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Minecraft LYN. All rights reserved.</p>
    </footer>

<script>
  const SUPABASE_URL = 'https://ajdycfejspyolnzsacwv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_JmaK4GoZnrcp-yLno3n8Tg_Fx89cg1E';
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadResources() {
    const { data: posts, error } = await supabase
      .from('posts')
      .select('*')
      .order('id', { ascending: false });

    if (error) {
      console.error('Error fetching data:', error.message);
      return;
    }

    const homeGrid = document.getElementById('home-grid');
    if (!homeGrid) return;

    if (!posts || posts.length === 0) {
      homeGrid.innerHTML = '<div class="empty-state">No resources uploaded yet.</div>';
      return;
    }

    homeGrid.innerHTML = '';

    posts.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${item.image || 'https://via.placeholder.com/300x160'}" alt="${item.title}">
        <div class="card-content">
          <div class="card-title">${item.title}</div>
          <div class="card-desc">${item.description || ''}</div>
          <div class="card-footer">
            <span class="badge">${item.category || 'Resource'}</span>
            <a href="${item.download_url || '#'}" target="_blank" style="color: var(--cyan); text-decoration: none; font-weight: bold;">Download</a>
          </div>
        </div>
      `;
      homeGrid.appendChild(card);
    });
  }

  document.addEventListener('DOMContentLoaded', loadResources);
</script>

</body>
</html>
