<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">Minecraft LYN - Addons, Shaders & Maps</title>
    <style>
        :root {
            --bg-black: #0B0E14;
            --card-bg: #151A23;
            --cyan: #00D9FF;
            --text-main: #F1F5F9;
            --text-sub: #94A3B8;
            --border: #222B3A;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-main); line-height: 1.5; }

        header { 
            background: rgba(11, 14, 20, 0.9); 
            padding: 12px 16px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); 
        }
        .menu-btn { background: none; border: none; color: var(--cyan); font-size: 22px; cursor: pointer; }
        .logo-img { height: 34px; object-fit: contain; cursor: pointer; }

        .main-container { max-width: 900px; margin: 0 auto; padding: 15px; }

        .hero { 
            background: linear-gradient(180deg, rgba(11,14,20,0.5), var(--bg-black)), 
                        url('https://github.com/minecraftlyn/Mcphoto/blob/1f9da41800bc4e29cdea3b6a12b25b1ee239b5c9/pixel-minecraft-style-land-background-concept-game-ground-pixelated-horizontal-blue-sky-sun-cloud-vector-illustration-212305683.jpg?raw=true') center/cover; 
            padding: 30px 15px; border-radius: 12px; border: 1px solid var(--border); text-align: center; margin-bottom: 20px;
        }
        .hero h1 { font-size: 20px; color: #fff; }
        .hero h1 span { color: var(--cyan); }
        .hero p { font-size: 12px; color: var(--text-sub); margin-top: 4px; }

        .search-box input { 
            width: 100%; padding: 12px 18px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 25px; outline: none; color: #fff; font-size: 13px; margin-bottom: 15px;
        }

        .category-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .chip { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .chip.active { background: rgba(0, 217, 255, 0.15); border-color: var(--cyan); color: var(--cyan); }

        .page-section { display: none; }
        .page-section.active { display: block; }
        .section-title { font-size: 16px; font-weight: bold; color: var(--text-main); margin-bottom: 15px; border-left: 3px solid var(--cyan); padding-left: 10px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        
        .card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; }
        .card-img-wrap { width: 100%; height: 140px; background: #000; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 12px; }
        .card-title { font-size: 14px; font-weight: bold; color: var(--text-main); margin-bottom: 6px; }
        .card-desc { font-size: 11px; color: var(--text-sub); margin-bottom: 10px; height: 32px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-footer { font-size: 11px; color: var(--text-sub); display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 8px; }

        .breadcrumbs { font-size: 12px; color: var(--text-sub); margin-bottom: 15px; }
        .breadcrumbs a { color: var(--cyan); text-decoration: none; cursor: pointer; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 6px 14px; border-radius: 15px; cursor: pointer; margin-bottom: 15px; font-size: 12px; }

        .detail-header-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
        .detail-cover-img { width: 100%; max-height: 300px; object-fit: cover; }
        .detail-header-content { padding: 16px; }
        .badge { background: rgba(0, 217, 255, 0.1); border: 1px solid var(--cyan); color: var(--cyan); padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        
        .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 15px 0; }
        .meta-card { background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 8px; border-radius: 6px; text-align: center; }
        .meta-label { font-size: 10px; color: var(--text-sub); }
        .meta-val { font-size: 12px; font-weight: bold; color: #fff; }

        .hero-download-btn { display: block; width: 100%; background: var(--cyan); color: #000; padding: 12px; font-weight: bold; text-decoration: none; border-radius: 8px; font-size: 14px; text-align: center; border: none; cursor: pointer; }
        .info-block { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 8px; font-size: 12px; color: var(--text-sub); white-space: pre-line; margin-top: 10px; }
        .screenshots-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .screenshots-grid img { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }

        .nav-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 14, 20, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        .nav-overlay.active { display: flex; }
        .close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--cyan); font-size: 24px; cursor: pointer; }
        .nav-links { list-style: none; text-align: center; }
        .nav-links li { margin: 15px 0; }
        .nav-links a { color: var(--text-main); text-decoration: none; font-size: 16px; font-weight: bold; cursor: pointer; }

        footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text-sub); border-top: 1px solid var(--border); margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
        <img src="https://raw.githubusercontent.com/minecraftlyn/Mcphoto/fadf178b72cb6a942deb3105ba06118e7a2d030f/bitmap2216761670976185018.png" alt="Minecraft LYN" class="logo-img" onclick="switchPage('home')">
        <div style="width: 22px;"></div>
    </header>

    <div class="main-container">
        <!-- HOME PAGE -->
        <div id="home-page" class="page-section active">
            <div class="hero">
                <h1>WELCOME TO <span>MINECRAFT LYN</span></h1>
                <p>Download Best Minecraft Bedrock Addons, Shaders & Maps</p>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 Search addons, shaders, maps...">
            </div>

            <div class="category-chips">
                <div class="chip active" onclick="filterCategory('all', this)">🔥 All</div>
                <div class="chip" onclick="filterCategory('addon', this)">🧩 Addons</div>
                <div class="chip" onclick="filterCategory('shader', this)">✨ Shaders</div>
                <div class="chip" onclick="filterCategory('map', this)">🗺️ Maps</div>
            </div>

            <div class="section-title">Latest Updates</div>
            <div class="card-grid" id="home-grid"><div>Loading content...</div></div>
        </div>

        <!-- CATEGORY PAGES -->
        <div id="addon-page" class="page-section"><div class="section-title">Minecraft Addons</div><div class="card-grid" id="addon-grid"></div></div>
        <div id="shader-page" class="page-section"><div class="section-title">Minecraft Shaders</div><div class="card-grid" id="shader-grid"></div></div>
        <div id="map-page" class="page-section"><div class="section-title">Minecraft Maps</div><div class="card-grid" id="map-grid"></div></div>

        <!-- DETAIL PAGE -->
        <div id="post-detail-page" class="page-section">
            <button class="back-btn" onclick="switchPage('home')">← Back to Home</button>
            <div id="breadcrumbs" class="breadcrumbs"></div>
            <div id="post-detail-content"></div>
        </div>
    </div>

    <!-- MENU OVERLAY -->
    <div class="nav-overlay" id="navOverlay">
        <button class="close-btn" onclick="toggleMenu()">✕</button>
        <ul class="nav-links">
            <li><a onclick="navigate('home')">🏠 Home</a></li>
            <li><a onclick="navigate('addon')">🧩 Addons</a></li>
            <li><a onclick="navigate('shader')">✨ Shaders</a></li>
            <li><a onclick="navigate('map')">🗺️ Maps</a></li>
        </ul>
    </div>

    <footer>
        <p><b>MINECRAFT LYN</b> — Minecraft Bedrock Resources</p>
    </footer>

    <script>
        let allPosts = [];
        let currentCategory = 'all';

        function toggleMenu() { document.getElementById('navOverlay').classList.toggle('active'); }
        
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId + '-page');
            if (target) target.classList.add('active');
            window.scrollTo(0, 0);
        }

        function navigate(pageId) { toggleMenu(); switchPage(pageId); }

        // Fetching Posts safely
        fetch('posts.json?v=' + Date.now())
            .then(res => {
                if (!res.ok) throw new Error("Network error loading posts.json");
                return res.json();
            })
            .then(data => { 
                allPosts = data; 
                renderPosts(allPosts); 
                renderCategoryGrids();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('home-grid').innerHTML = `<div style="color:red; padding:20px;">Error loading posts. Please check posts.json formatting.</div>`;
            });

        function createCardHTML(post) {
            return `
                <div class="card" onclick="openPost('${post.id}')">
                    <div class="card-img-wrap">
                        <img src="${post.image}" alt="${post.title}" onerror="this.src='https://via.placeholder.com/300x150?text=No+Image'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${post.title}</div>
                        <div class="card-desc">${post.shortDesc}</div>
                        <div class="card-footer">
                            <span>Downloads: ${post.downloads || 0}</span>
                            <span>Views: ${post.views || 0}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPosts(posts) {
            const grid = document.getElementById('home-grid');
            if(posts.length === 0) {
                grid.innerHTML = `<div>No posts found.</div>`;
                return;
            }
            grid.innerHTML = posts.map(createCardHTML).join('');
        }

        function renderCategoryGrids() {
            document.getElementById('addon-grid').innerHTML = allPosts.filter(p => p.category === 'addon').map(createCardHTML).join('');
            document.getElementById('shader-grid').innerHTML = allPosts.filter(p => p.category === 'shader').map(createCardHTML).join('');
            document.getElementById('map-grid').innerHTML = allPosts.filter(p => p.category === 'map').map(createCardHTML).join('');
        }

        function filterCategory(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            handleSearch();
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allPosts;
            if (currentCategory !== 'all') filtered = filtered.filter(p => p.category === currentCategory);
            if (query.trim() !== '') {
                filtered = filtered.filter(p => p.title.toLowerCase().includes(query) || p.shortDesc.toLowerCase().includes(query));
            }
            renderPosts(filtered);
        }

        function openPost(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;

            document.getElementById('breadcrumbs').innerHTML = `
                <a onclick="switchPage('home')">Home</a> » 
                <span>${post.title}</span>
            `;

            let screenshotsHTML = (post.screenshots && post.screenshots.length > 0) ? `
                <div style="font-size:13px; font-weight:bold; color:var(--cyan); margin-top:20px;">SCREENSHOTS</div>
                <div class="screenshots-grid">${post.screenshots.map(s => `<img src="${s}">`).join('')}</div>
            ` : '';

            document.getElementById('post-detail-content').innerHTML = `
                <div class="detail-header-card">
                    <img src="${post.image}" class="detail-cover-img" onerror="this.src='https://via.placeholder.com/600x300?text=No+Image'">
                    <div class="detail-header-content">
                        <h2 style="font-size: 16px; font-weight: bold; color: #fff;">${post.title}</h2>
                        <div style="margin-top: 6px;">
                            <span class="badge">${(post.category || 'addon').toUpperCase()}</span>
                        </div>

                        <div class="meta-grid">
                            <div class="meta-card"><div class="meta-label">MC VERSION</div><div class="meta-val">${post.mcVersion || '1.20+'}</div></div>
                            <div class="meta-card"><div class="meta-label">FILE SIZE</div><div class="meta-val">${post.fileSize || 'N/A'}</div></div>
                        </div>

                        <button onclick="window.open('${post.downloadLink}', '_blank')" class="hero-download-btn">DOWNLOAD NOW</button>
                    </div>
                </div>

                <div style="font-size:13px; font-weight:bold; color:var(--cyan);">ABOUT THIS RESOURCE</div>
                <div class="info-block">${post.fullReview}</div>

                ${screenshotsHTML}
            `;

            switchPage('post-detail');
        }
    </script>
</body>
</html>
