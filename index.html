<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft LYN - Premium Addons, Shaders & Maps</title>
    <style>
        :root {
            --bg-dark: #081426;
            --card-bg: #1A273B;
            --card-hover: #22334D;
            --cyan: #00D9FF;
            --discord: #5865F2;
            --telegram: #24A1DE;
            --text-main: #F1F5F9;
            --text-sub: #94A3B8;
            --border: #2B3A52;
            --glow: 0 0 15px rgba(0, 217, 255, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }

        header {
            background-color: rgba(11, 20, 38, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .main-container { max-width: 1000px; margin: 0 auto; padding: 20px 15px; }

        .hero {
            background: linear-gradient(180deg, rgba(11, 20, 38, 0.4) 0%, var(--card-bg) 100%);
            padding: 30px 15px; border-radius: 16px; border: 1px solid var(--border);
            text-align: center; margin-bottom: 25px;
        }
        .hero h1 { font-size: 22px; font-weight: 900; color: var(--text-main); margin-bottom: 8px; }
        .hero h1 span { color: var(--cyan); text-shadow: var(--glow); }
        .hero p { font-size: 13px; color: var(--text-sub); max-width: 90%; margin: 0 auto; }

        .search-box { margin-bottom: 20px; }
        .search-box input {
            width: 100%; padding: 12px 20px; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 30px; color: #fff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .search-box input:focus { border-color: var(--cyan); box-shadow: var(--glow); }

        .nav-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; }
        .tab-btn {
            background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub);
            padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .tab-btn.active { background: rgba(0, 217, 255, 0.1); border-color: var(--cyan); color: var(--cyan); }

        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

        .posts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .post-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
            cursor: pointer; transition: 0.3s;
        }
        .post-card:hover { transform: translateY(-3px); border-color: var(--cyan); }
        .card-img { width: 100%; height: 160px; object-fit: cover; }
        .card-content { padding: 12px; }
        .card-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; color: #fff; }
        .card-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Modal Box Styling */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center;
            z-index: 1000; padding: 15px;
        }
        .modal-card {
            background: var(--card-bg); border: 1px solid var(--cyan); border-radius: 16px;
            max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative;
        }
        .close-btn {
            position: absolute; top: 10px; right: 15px; font-size: 24px; color: var(--text-sub); cursor: pointer;
        }
        .download-btn {
            display: block; width: 100%; padding: 12px; background: var(--cyan); color: #000;
            text-align: center; font-weight: bold; border-radius: 8px; text-decoration: none; margin-top: 15px;
        }

        .community-box {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 30px;
        }
        .community-btns { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
        .c-btn { padding: 10px 20px; border-radius: 8px; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; }
        .c-btn.discord { background: var(--discord); }
        .c-btn.telegram { background: var(--telegram); }

        footer { text-align: center; padding: 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-sub); }
        .empty-state { text-align: center; padding: 40px 10px; color: var(--text-sub); width: 100%; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 800; color: var(--cyan);">MINECRAFT LYN</div>
    </header>

    <div class="main-container">
        <div class="hero">
            <h1>WELCOME TO <span>MINECRAFT LYN</span></h1>
            <p>Download Best Minecraft Bedrock Addons, Shaders & Maps</p>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search addons, shaders, maps..." oninput="handleSearch()">
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="filterCategory('all', this)">🔥 All</button>
            <button class="tab-btn" onclick="filterCategory('addon', this)">🧩 Addons</button>
            <button class="tab-btn" onclick="filterCategory('shader', this)">✨ Shaders</button>
            <button class="tab-btn" onclick="filterCategory('map', this)">🗺️ Maps</button>
        </div>

        <div class="section-title">🆕 Latest Updates</div>
        <div class="posts-grid" id="home-grid">
            <div class="empty-state">⏳ Loading posts...</div>
        </div>

        <div class="community-box">
            <p>💬 Join Our Minecraft Community</p>
            <div class="community-btns">
                <a href="#" class="c-btn discord">Discord</a>
                <a href="#" class="c-btn telegram">Telegram</a>
            </div>
        </div>
    </div>

    <!-- Details Pop-up Modal -->
    <div class="modal-overlay" id="detail-modal">
        <div class="modal-card">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        © 2026 MINECRAFT LYN — Best Bedrock Resource Platform
    </footer>

    <script>
        let allPosts = [];

        async function fetchPosts() {
            const homeGrid = document.getElementById('home-grid');
            try {
                const res = await fetch('posts.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error(`posts.json မတွေ့ပါ (Status: ${res.status})`);

                allPosts = await res.json();
                if (!Array.isArray(allPosts) || allPosts.length === 0) {
                    homeGrid.innerHTML = `<div class="empty-state">⚠️ posts.json ထဲမှာ Data မရှိပါ။</div>`;
                    return;
                }
                renderPosts(allPosts);
            } catch (err) {
                console.error("Fetch Error:", err);
                homeGrid.innerHTML = `<div class="empty-state">❌ <b>Error Loading Posts:</b><br>${err.message}</div>`;
            }
        }

        function renderPosts(posts) {
            const homeGrid = document.getElementById('home-grid');
            if (posts.length === 0) {
                homeGrid.innerHTML = `<div class="empty-state">မရှိပါ။</div>`;
                return;
            }

            homeGrid.innerHTML = posts.map((post, index) => `
                <div class="post-card" onclick="openModal(${index})">
                    <img src="${post.image}" class="card-img" alt="${post.title}" onerror="this.src='https://via.placeholder.com/300x150?text=No+Image'">
                    <div class="card-content">
                        <div class="card-title">${post.title}</div>
                        <div class="card-desc">${post.shortDesc || ''}</div>
                    </div>
                </div>
            `).join('');
        }

        function openModal(index) {
            const post = allPosts[index];
            if (!post) return;

            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <img src="${post.image}" style="width:100%; border-radius:8px; margin-bottom:12px;">
                <h2>${post.title}</h2>
                <p style="color:var(--text-sub); margin:8px 0;">${post.shortDesc || ''}</p>
                <div style="font-size:13px; color:var(--cyan); margin:10px 0;">
                    Version: ${post.mcVersion || 'N/A'} | Size: ${post.fileSize || 'N/A'}
                </div>
                <div>${post.fullReview || ''}</div>
                <a href="${post.downloadLink || '#'}" class="download-btn" target="_blank">📥 Download Now</a>
            `;
            document.getElementById('detail-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detail-modal').style.display = 'none';
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'all') {
                renderPosts(allPosts);
            } else {
                renderPosts(allPosts.filter(p => p.category && p.category.toLowerCase() === cat.toLowerCase()));
            }
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase();
            renderPosts(allPosts.filter(p => p.title.toLowerCase().includes(query)));
        }

        document.addEventListener('DOMContentLoaded', fetchPosts);
    </script>
</body>
</html>
