<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft LYN - Premium Bedrock Resources</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-black: #0B0E14;
            --card-bg: #151A23;
            --cyan: #00D0FF;
            --cyan-hover: #00B8D0;
            --text-main: #F1FSFR;
            --text-sub: #94A3B8;
            --border: #222B3A;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-black); color: #FFFFFF; line-height: 1.6; }
        header {
            background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 20px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
        }
        .menu-btn { background: none; border: none; color: var(--cyan); font-size: 22px; cursor: pointer; }
        .logo-img { height: 34px; object-fit: contain; cursor: pointer; }
        .main-container { max-width: 900px; margin: 0 auto; padding: 20px 15px; }
        .hero {
            background: linear-gradient(180deg, rgba(11,14,20,0.6), var(--bg-black));
            padding: 35px 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; margin-bottom: 25px;
        }
        .hero h1 { font-size: 22px; color: #fff; }
        .hero h1 span { color: var(--cyan); }
        .hero p { font-size: 13px; color: var(--text-sub); margin-top: 6px; }
        .search-box input {
            width: 100%; padding: 12px 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 20px; outline: none;
        }
        .search-box input:focus { border-color: var(--cyan); }
        .category-chips { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; }
        .chip { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-sub); padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .chip.active { background: var(--cyan); color: #0B0E14; border-color: var(--cyan); font-weight: 600; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .section-title { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 20px; border-left: 3px solid var(--cyan); padding-left: 10px; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .card:hover { border-color: var(--cyan); transform: translateY(-2px); }
        .card-img-wrap { width: 100%; height: 140px; background: #000; }
        .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 14px; }
        .card-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 6px; }
        .card-desc { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; height: 36px; overflow: hidden; }
        .card-footer { font-size: 11px; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; }
        footer { text-align: center; padding: 30px 15px; color: var(--text-sub); font-size: 12px; border-top: 1px solid var(--border); margin-top: 40px; }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <img src="https://minecraftlyn.github.io/logo.png" alt="Logo" class="logo-img" onerror="this.style.display='none'" onclick="navigate('home')">
    </header>

    <div class="main-container">
        <!-- HOME SECTION -->
        <section id="home-page" class="page-section active">
            <div class="hero">
                <h1>WELCOME TO <span>MINECRAFT LYN</span></h1>
                <p>Download Best Minecraft Bedrock Addons, Shaders & Maps</p>
            </div>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search addons, shaders, maps..." oninput="filterPosts()">
            </div>

            <div class="category-chips">
                <div class="chip active" onclick="filterCategory('all', this)">All</div>
                <div class="chip" onclick="filterCategory('addon', this)">Addons</div>
                <div class="chip" onclick="filterCategory('shader', this)">Shaders</div>
                <div class="chip" onclick="filterCategory('maps', this)">Maps</div>
            </div>

            <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Latest Updates</div>
            <div id="home-grid" class="card-grid">
                <p style="color: var(--text-sub);">Loading content...</p>
            </div>
        </section>
    </div>

    <footer>
        <p><b>MINECRAFT LYN</b> — Minecraft Bedrock Resources</p>
    </footer>

    <script>
        let allPosts = [];
        let currentCategory = 'all';

        async function loadJSONData() {
            try {
                const res = await fetch('./posts.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("File not found");
                allPosts = await res.json();
                renderPosts(allPosts);
            } catch (err) {
                console.error(err);
                document.getElementById('home-grid').innerHTML = `
                    <div style="color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; padding: 15px; border-radius: 8px; width: 100%;">
                        <b>Data Loading Error!</b><br>
                        1. posts.json ဖိုင်နာမည်နှင့် လမ်းကြောင်း မှန်ကန်မှု ရှိမရှိ စစ်ဆေးပါ။<br>
                        2. JSON Format အတွင်း ကော်မာ သို့မဟုတ် စကွင်း အမှားအယွင်း ရှိမရှိ စစ်ဆေးပါ။
                    </div>
                `;
            }
        }

        function createCardHTML(post) {
            let views = parseInt(localStorage.getItem('views_' + post.id)) || post.views || 0;
            let downloads = parseInt(localStorage.getItem('dl_' + post.id)) || post.downloads || 0;

            return `
                <div class="card" onclick="alert('${post.title}')">
                    <div class="card-img-wrap">
                        <img src="${post.image}" alt="${post.title}" onerror="this.src='https://via.placeholder.com/300x150?text=No+Image'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${post.title}</div>
                        <div class="card-desc">${post.shortDesc}</div>
                        <div class="card-footer">
                            <span><i class="fa-solid fa-download"></i> ${downloads}</span>
                            <span><i class="fa-solid fa-eye"></i> ${views}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPosts(postsToRender) {
            const grid = document.getElementById('home-grid');
            if (!grid) return;
            if (!postsToRender || postsToRender.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-sub);">No content found.</p>`;
                return;
            }
            grid.innerHTML = postsToRender.map(post => createCardHTML(post)).join('');
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            if(element) element.classList.add('active');
            filterPosts();
        }

        function filterPosts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPosts.filter(post => {
                const matchesCategory = currentCategory === 'all' || post.category === currentCategory;
                const matchesQuery = post.title.toLowerCase().includes(query) || post.shortDesc.toLowerCase().includes(query);
                return matchesCategory && matchesQuery;
            });
            renderPosts(filtered);
        }

        function navigate(pageId) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
            window.scrollTo(0, 0);
        }

        window.onload = function() {
            loadJSONData();
        };
    </script>
</body>
</html>
